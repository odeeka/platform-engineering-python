name: Config Validator CI

on:
  push:
    paths:
      - "02_config_validator_policy_engine/**"
  pull_request:
    paths:
      - "02_config_validator_policy_engine/**"

defaults:
  run:
    working-directory: 02_config_validator_policy_engine

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install '.[dev]'

      - name: Run tests
        run: pytest -v

      - name: Smoke test — validate example configs
        run: |
          config-validator --json --env prod examples/good_prod.yaml
          config-validator --json --env dev examples/minimal_dev.yaml
          config-validator --json examples/service.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t config-validator:ci .
        working-directory: 02_config_validator_policy_engine

      - name: Smoke test container
        run: docker run --rm config-validator:ci --help
