name: Preflight Checker CI

on:
  push:
    paths:
      - "00_preflight_dependency_checker/**"
  pull_request:
    paths:
      - "00_preflight_dependency_checker/**"

defaults:
  run:
    working-directory: 00_preflight_dependency_checker

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install '.[dev]'

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t preflight-checker:ci .
        working-directory: 00_preflight_dependency_checker

      - name: Smoke test container
        run: docker run --rm preflight-checker:ci --help
