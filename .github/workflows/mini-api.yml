name: Mini API CI

on:
  push:
    paths:
      - "03_minimal_rest_api/**"
  pull_request:
    paths:
      - "03_minimal_rest_api/**"

defaults:
  run:
    working-directory: 03_minimal_rest_api

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install '.[dev]'

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mini-api:ci .
        working-directory: 03_minimal_rest_api

      - name: Smoke test container
        run: |
          docker run -d --name mini-api-test -p 8080:8080 mini-api:ci
          sleep 2
          curl -sf http://localhost:8080/health
          docker stop mini-api-test
